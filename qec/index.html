<!doctype html>
<html lang="id" data-theme="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E8A88">
<title>QEC — Quran Edu Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== v0.1 prototipe — gaya Aventra ===== */
:root{
  --pri:#0E7C7A; --top1:#0E8A88; --top2:#20B7B5; --top3:#32BDBB; --pri-ink:#fff; --acc:#F1F804; --tint:#E2F6F5;
  --bg:#F1F8F8; --card:#fff; --ink:#10302F; --mut:#4F6766; --line:#DCEBEA;
  --ok:#14955B; --ok-bg:#DFF5EA; --bad:#D63A3A; --bad-bg:#FDE7E7;
  --warn:#B76E00; --warn-bg:#FFF1D6; --info:#1F6FD1; --info-bg:#E3EEFF;
  --rad:16px;
}
html[data-theme="hitam"]{ --pri:#1E2120; --top1:#1E2120; --top2:#2B302E; --top3:#333836; --acc:#F2B01E; --tint:#FFF4D6; --bg:#F4F4F1; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;font-size:15px}
h1,h2,.t,.big,.kpi b,.tot,.btn,.sec,.tabs a,.side,.logo,.tile,.avatar{font-family:'Poppins','Open Sans',system-ui,sans-serif}
html.no-scroll{overflow:hidden}
body{-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;cursor:pointer}
a{color:inherit}

/* header + hero satu warna, gradasi + lingkaran samar */
.top{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--top1),var(--top2) 65%,var(--top3));padding:18px 18px 22px}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.top::before{width:260px;height:260px;right:-80px;top:-110px}
.top::after{width:160px;height:160px;left:-60px;bottom:-90px}
html[data-theme="hitam"] .top::before{background:rgba(242,176,30,.10)}
.bar{position:relative;display:flex;align-items:center;gap:12px;z-index:1}
.logo{width:38px;height:38px;border-radius:12px;background:var(--acc);color:#10302F;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.04em}
html[data-theme="hitam"] .logo{background:var(--acc);color:#1E2120}
.bar h1{margin:0;font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{border:0;background:rgba(255,255,255,.16);color:#fff;height:38px;border-radius:999px;padding:0 12px 0 4px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.avatar i{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#10302F;display:grid;place-items:center;font-style:normal;font-weight:800}
html[data-theme="hitam"] .avatar i{background:var(--acc);color:#1E2120}
.hero{position:relative;z-index:1;margin-top:18px}
.hero .hi{font-size:13px;opacity:.8}
.hero .big{font-size:30px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.hero .sub{font-size:13.5px;font-weight:700;color:var(--acc);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:20px;font-weight:800}
.kpi span{font-size:12px;opacity:.85}

/* tanda gulir antara header & menu bawah */
main{padding:16px 16px 120px;position:relative}
main::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#B9D6D4;margin:-6px auto 12px}

.sec{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.t{font-weight:700;font-size:15px}
.m{font-size:13px;color:var(--mut);margin-top:2px}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--info-bg);color:var(--info);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--pri);flex:0 0 42px}
html[data-theme="hitam"] .ico{background:#FFF4D6;color:#1E2120}
.ico svg{width:22px;height:22px}

/* tombol harus terlihat tombol */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border-radius:12px;border:0;font-weight:700;font-size:14.5px;background:var(--pri);color:#fff;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.12)}
html[data-theme="hitam"] .btn{background:var(--acc);color:#1E2120}
.btn.ok{background:var(--ok);color:#fff} .btn.bad{background:var(--bad);color:#fff}
.btn.lihat{background:var(--info-bg);color:var(--info);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.btn.sm{min-height:40px;font-size:13.5px}
.shake{animation:shake 2.4s ease-in-out infinite}
@keyframes shake{0%,82%,100%{transform:translateX(0)}85%{transform:translateX(-4px)}88%{transform:translateX(4px)}91%{transform:translateX(-3px)}94%{transform:translateX(3px)}}

/* input rata kiri-kanan */
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
select,input[type=text],input[type=number]{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font:inherit;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:#E3EFEE;border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;min-height:40px;border-radius:9px;font-weight:700;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.check{display:flex;align-items:center;gap:10px;min-height:46px;font-weight:600;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--pri)}
.sum{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.sum .row{justify-content:space-between;font-size:14px;padding:3px 0}
.sum .tot{font-size:18px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--mut)}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
html[data-theme="hitam"] .chips button.on{background:var(--acc);border-color:var(--acc);color:#1E2120}
.prog{height:8px;border-radius:8px;background:#E3EFEE;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--pri);border-radius:8px}
html[data-theme="hitam"] .prog i{background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12.5px;font-weight:700;text-decoration:none;position:relative}
.dot{position:absolute;top:8px;right:10px;min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 6px}
.ping{animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(214,58,58,.55)}100%{box-shadow:0 0 0 10px rgba(214,58,58,0)}}

/* menu bawah: gradasi, ikon aktif terisi putih, menu ke-3 di lengkungan halus */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;height:84px;padding-bottom:env(safe-area-inset-bottom)}
.tabs svg.bg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 -4px 14px rgba(20,26,51,.18))}
.tabs .items{position:absolute;left:0;right:0;bottom:0;height:68px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.72);text-decoration:none;font-size:11px;font-weight:600;position:relative}
.tabs a svg{width:24px;height:24px}
.tabs a.on{color:#fff;font-weight:800}
.tabs a.on span{color:var(--acc)}
.tabs a.on svg{animation:pop 1.6s ease-in-out infinite}
.tabs a.on svg .fill{fill:#fff;fill-opacity:1}
.tabs a.on svg .fill ~ :not(.fill){stroke:var(--pri)}
.tabs a.mid{transform:translateY(-14px)}
.tabs a.mid svg{width:28px;height:28px}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
html[data-theme="hitam"] .tabs a.on{color:var(--acc)}
html[data-theme="hitam"] .tabs a.on svg .fill{fill:var(--acc)}
html[data-theme="hitam"] .tabs a.on svg .fill ~ :not(.fill){stroke:#1E2120}

/* pop up */
.pop{position:fixed;inset:0;z-index:50;background:rgba(15,20,40,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px 24px}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:#B9D6D4;margin:4px auto 12px}
.sheet h2{margin:0 0 10px;font-size:18px}
.play{border:0;width:40px;height:40px;border-radius:50%;background:var(--info-bg);color:var(--info);display:grid;place-items:center;flex:0 0 40px}
.wave{display:flex;align-items:center;gap:2px;height:20px;margin-top:6px}
.wave i{display:block;width:3px;border-radius:2px;background:#9FD3D1}

/* desktop: menu samping dari sumber yang sama */
.side{display:none}
@media (min-width:960px){
  body{display:flex}
  .side{display:flex;flex-direction:column;gap:4px;width:250px;flex:0 0 250px;min-height:100vh;background:linear-gradient(180deg,var(--top1),var(--top2));color:#fff;padding:20px 14px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px;font-weight:800}
  .side .g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:12px 10px 4px}
  .side a{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;color:rgba(255,255,255,.85)}
  .side a svg{width:20px;height:20px}
  .side a.on{background:#fff;color:var(--pri)}
  html[data-theme="hitam"] .side a.on{background:var(--acc);color:#1E2120}
  .side a .dot{position:static;margin-left:auto}
  #app{flex:1;min-width:0}
  .bar .logo{display:none}
  .tabs{display:none}
  main{max-width:1000px;margin:0 auto;padding:20px 28px 40px}
  main::before{display:none}
  .top{padding:22px 28px 26px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));max-width:900px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
  .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .pop{align-items:center}
  .sheet{border-radius:22px}
}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.demo{font-size:11px;color:var(--mut);text-align:center;margin-top:16px}

/* ===== v1.0 — login + data jalan ===== */
.login{min-height:100vh;display:flex;flex-direction:column}
.login .top{padding:34px 22px 70px;text-align:left}
.login .brandbig{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.login .brandbig .logo{width:48px;height:48px;font-size:14px}
.login .brandbig b{font-family:'Poppins',sans-serif;font-size:20px;display:block}
.login .brandbig span{font-size:13px;opacity:.9}
.login h1{font-family:'Poppins',sans-serif;margin:26px 0 0;font-size:30px;line-height:1.15;position:relative;z-index:1}
.login .hl{color:var(--acc);font-weight:700;font-size:14px;margin-top:6px;position:relative;z-index:1;font-family:'Poppins',sans-serif}
.login .box{margin:-44px 16px 0;position:relative;z-index:2}
.login .wrapin{max-width:460px;width:100%;margin:0 auto;padding-bottom:40px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-top:10px}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:5px;height:36px;border:0;background:var(--tint);color:var(--pri);border-radius:9px;padding:0 10px;font-weight:700;font-size:12.5px}
input[type=email],input[type=password]{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font:inherit;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--top2);outline-offset:1px}
.acc{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc code{font-size:12.5px;background:var(--tint);color:var(--pri);padding:2px 6px;border-radius:6px}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:20px;height:20px;flex:0 0 20px}
.acc .btn{flex:0 0 auto}
.acc .grow{flex:1;min-width:0}
.mini{display:inline-flex;width:auto;padding:0 14px;min-height:40px;font-size:13.5px}


/* ===== v1.1 — layar penuh desktop, tablet 2 kolom, HP kecil ===== */
.feat{display:none}
@media (max-width:380px){
  html,body{font-size:14px}
  .top{padding:16px 14px 18px}
  .bar{gap:8px} .bar h1{font-size:16px}
  .avatar{padding:0 10px 0 4px;font-size:12px}
  .hero .big{font-size:26px}
  .kpi b{font-size:17px}
  main{padding:14px 12px 120px}
  .grid{gap:8px} .tile{font-size:11.5px;padding:12px 4px}
  .btns{gap:6px} .btn{font-size:13.5px}
  .tabs a{font-size:10px}
  .login h1{font-size:26px}
}
@media (min-width:640px){
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-content:start}
  main > :not(.card){grid-column:1/-1}
  main > .card{margin-bottom:0}
  main > .card.form{grid-column:1/-1;max-width:760px;width:100%}
  main > .btn{max-width:360px}
  main::before{grid-column:1/-1}
  .sec{margin:10px 2px -4px}
  .cols{display:contents}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:960px){
  body{display:flex;min-height:100vh}
  #app{flex:1;min-width:0;min-height:100vh;display:flex;flex-direction:column}
  #app > main{flex:1;max-width:none;width:100%;margin:0;padding:24px 32px 40px}
  .top{padding:24px 32px 28px}
  .kpis{max-width:none}
  .kpi{padding:14px 16px} .kpi b{font-size:24px}
  .hero .big{font-size:34px}
  .side{width:260px;flex:0 0 260px}
  .sheet{max-width:620px}
  /* login: layar terbagi dua */
  .login{flex-direction:row;width:100%;min-height:100vh}
  .login .top{flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 64px}
  .login .top::before{width:520px;height:520px;right:-160px;top:-200px}
  .login .top::after{width:320px;height:320px;left:-120px;bottom:-160px}
  .login h1{font-size:46px;margin-top:40px}
  .login .hl{font-size:17px}
  .feat{display:grid;gap:12px;margin-top:36px;position:relative;z-index:1;max-width:460px}
  .feat div{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14.5px}
  .feat svg{width:22px;height:22px;flex:0 0 22px}
  .login .wrapin{flex:0 0 520px;max-width:520px;margin:0;padding:40px 44px;display:flex;flex-direction:column;justify-content:center;overflow:auto;max-height:100vh}
  .login .box{margin:0}
}
@media (min-width:1500px){
  main{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
}

/* ===== v2.0 — fitur standar Aventra ===== */
.bar .icon-btn{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;position:relative}
.bar .icon-btn svg{width:21px;height:21px}
.bar .icon-btn .n{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--top2)}
@media (max-width:440px){ .avatar .lbl{display:none} .avatar{padding:0 4px} .bar .icon-btn{width:36px;height:36px;flex-basis:36px} }
.billbar{display:flex;align-items:center;gap:10px;background:#FFF7DB;border-bottom:1px solid #F3DE9A;padding:10px 16px;font-size:13.5px;color:#5A4300}
.billbar .grow{flex:1;min-width:0}
.billbar > svg,.sabar > svg{width:20px;height:20px;flex:0 0 20px}
.billbar .btn{width:auto;min-height:38px;padding:0 16px;font-size:13.5px}
.sabar{display:flex;align-items:center;gap:10px;background:#10302F;color:#fff;padding:8px 16px;font-size:13px;font-weight:600}
.sabar .grow{flex:1}
.sabar button{border:0;background:var(--acc);color:#10302F;border-radius:9px;min-height:34px;padding:0 12px;font-weight:800;font-size:12.5px}
.ann{display:flex;gap:10px;align-items:flex-start;background:#FFFBEA;border:1px solid #F1E3A6;border-radius:var(--rad);padding:12px 14px;margin-bottom:10px}
.ann .ico{background:#fff;color:#8A6A00}
.ann.pen{background:#FFF0F0;border-color:#F5C9C9}.ann.pen .ico{color:var(--bad)}
.copy{border:0;background:var(--tint);color:var(--pri);width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;vertical-align:middle;margin-left:4px}
.copy svg{width:15px;height:15px}
.no{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--mut)}
.lock{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:auto;opacity:.85}
.lock svg{width:15px;height:15px}
.lockbox{text-align:center;padding:30px 18px}
.lockbox .big{width:64px;height:64px;border-radius:20px;background:var(--tint);color:var(--pri);display:grid;place-items:center;margin:0 auto 12px}
.lockbox .big svg{width:32px;height:32px}
.side .search{position:relative;margin:0 4px 6px}
.side .search input{width:100%;min-height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.16);color:#fff;padding:0 34px 0 12px;font:inherit;font-size:13.5px}
.side .search input::placeholder{color:rgba(255,255,255,.7)}
.side .search kbd{position:absolute;right:8px;top:10px;font-size:11px;background:rgba(255,255,255,.2);border-radius:5px;padding:1px 6px;font-family:inherit}
.side button.g{display:flex;width:100%;align-items:center;justify-content:space-between;background:none;border:0;color:#fff;cursor:pointer;font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:12px 0 4px;padding:0 10px}
.side button.g svg{width:14px;height:14px;transition:transform .2s}
.side button.g.shut svg{transform:rotate(-90deg)}
.side .ver{margin-top:auto;font-size:11.5px;opacity:.6;padding:14px 10px 0}
.notif-item{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.notif-item:first-child{border-top:0}
.notif-item.unread .t::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
.headsup{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:70;width:min(440px,92vw);background:#fff;border:1px solid var(--line);border-left:0;border-radius:16px;box-shadow:0 14px 40px rgba(15,40,40,.25);padding:12px 14px;display:flex;gap:10px;align-items:center;animation:hu .35s ease-out}
@keyframes hu{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.pick{display:flex;align-items:center;gap:10px;min-height:50px;border-top:1px solid var(--line);font-weight:600}
.pick:first-child{border-top:0}

function hitung({p,d,s,baru,anak,buku}){
  const c = CFG(), base = c.price[p][d] * s/4;
  const disc = (s>=8 ? .05 : 0) + (p==='OFF' && anak ? .05 : 0);
  const reg = baru ? c.daftar : 0, bk = (p==='OFF' && buku) ? c.buku : 0;
  return {base, disc, potong: base*disc, reg, bk, tot: base*(1-disc) + reg + bk};
}

function applyRules(){

}

  return `<div class="card lockbox form"><div class="big">${svg('lock')}</div><div class="t" style="font-size:18px">${esc(m.n)}</div><div class="m" style="margin:6px 0 14px">${esc(m.d)}</div><div class="t">${rp(m.price)} / bulan</div>
    <div style="margin-top:14px;max-width:320px;margin-left:auto;margin-right:auto">${own?act('Buka sekarang','bukaModul','',`data-k="${k}"`):act('Minta owner membuka','mintaModul','ghost',`data-k="${k}"`)}</div></div>`;
}

const P = {};
P.beranda = () => {
  const u = me(), r = u.role;
  if(r==='owner'){
    const span = {hari:DAY, '7':7*DAY, bulan:30*DAY}[S.per], from = now()-span;
    const L = DB.inv.filter(i=>i.st==='lunas' && (i.paid||i.ts) >= from), omzet = L.reduce((a,i)=>a+i.v,0);
    const F = [['hari','Hari ini'],['7','7 hari'],['bulan','Bulan ini']];
    return head('Beranda', `<div class="hero"><div class="chips" style="margin-bottom:8px">${F.map(([k,l])=>`<button class="${S.per===k?'on':''}" data-act="per" data-v="${k}" style="background:${S.per===k?'#fff':'rgba(255,255,255,.14)'};color:${S.per===k?'var(--pri)':'#fff'};border-color:transparent">${l}</button>`).join('')}</div>
    <div class="hi">Omzet lunas · ${L.length} invoice</div><div class="big">${rp(omzet)}</div><div class="sub">Target Rp50–100 jt / bulan</div>
    <div class="kpis"><div class="kpi"><b>${aktif().length}</b><span>Kelas aktif</span></div><div class="kpi"><b>${DB.mentors.filter(m=>m.st==='aktif').length}</b><span>Mentor aktif</span></div><div class="kpi"><b>${DB.match.length}</b><span>Menunggu mentor</span></div><div class="kpi"><b>${DB.inv.filter(i=>i.st==='tunggu').length}</b><span>Belum lunas</span></div></div></div>`) +
    `<main>${annBlock()}<div class="sec">Perlu tindakan</div>
    ${card('refresh',`${PAGES.perpanjang.badge()} perpanjangan`,'Sisa ≤ 1 sesi · tanpa biaya daftar',`<a class="btn ok mini" href="#perpanjang">Proses</a>`)}

    ${card('star',`${DB.match.length} santri menunggu mentor`,'Pilih kandidat atau tetapkan otomatis',`<a class="btn lihat mini" href="#matching">Lihat</a>`)}
    <div class="sec">Kelas berjalan</div>${aktif().slice(0,6).map(k=>`<div class="card"><div class="row"><div class="ico">${svg('book')}</div><div class="grow"><div class="t">${esc(k.n)}</div><div class="m">${esc(k.m)} · sesi ${k.used}/${k.tot}</div></div>${k.hari>CFG().sanksiHari?`<span class="chip bad">&gt; ${CFG().sanksiHari} hari</span>`:k.tot-k.used<=1?'<span class="chip warn">Perpanjang</span>':'<span class="chip ok">Normal</span>'}</div><div class="prog"><i style="width:${k.used/k.tot*100}%"></i></div></div>`).join('') || empty('Belum ada kelas')}

    <div class="kpis"><div class="kpi"><b>${DB.inv.filter(i=>i.st==='tunggu').length}</b><span>Invoice belum lunas</span></div><div class="kpi"><b>${rp(utang)}</b><span>Payroll belum dibayar</span></div></div></div>`) +
    `<main>${annBlock()}<div class="sec">Invoice terbaru</div>${DB.inv.slice(-4).reverse().map(invCard).join('')}

  if(r==='cs'){

    <div class="kpis"><div class="kpi"><b>${baru.length}</b><span>Perlu dibalas manusia</span></div><div class="kpi"><b>${DB.match.length}</b><span>Menunggu mentor</span></div></div></div>`) +

    ${k?`<div class="card"><div class="row"><div class="ico">${svg('book')}</div><div class="grow"><div class="t">${esc(k.n)} · ${PNAME[k.p]} ${k.d}</div><div class="m">Sesi ${Math.min(k.used+1,k.tot)} dari ${k.tot} · izin ${k.iz}/${kuota(k)}</div></div></div>
      <div class="btns"><a class="btn lihat" href="#kelasku">Kelas saya</a><button class="btn ok" data-act="toAbsen" data-id="${k.id}">Isi absen</button></div></div>`:empty('Belum ada kelas')}
    <div class="sec">Lowongan baru</div>
    ${low?`<div class="card"><div class="row"><div class="ico">${svg('brief')}</div><div class="grow"><div class="t">${PNAME[low.p]} ${low.d} · ${esc(low.area)}</div><div class="m">${esc(low.jadwal)} · ${low.bids.length}/4 pelamar</div></div><span class="chip bad">Baru</span></div>
      <div class="btns"><a class="btn ghost" href="#lowongan">Semua</a>${act('Saya minat','minat','',`data-id="${low.id}"`)}</div></div>`:empty('Tidak ada lowongan baru')}
    <div class="card row" style="background:var(--warn-bg);border-color:#F3D9A4"><div class="ico" style="background:#fff;color:var(--warn)">${svg('alert')}</div><div class="grow"><div class="t" style="color:var(--warn)">Tutup kontrak ≤ ${CFG().bonusHari} hari</div><div class="m">Agar bonus retensi berlaku</div></div></div></main>`;
  }
  const k = myKelasSantri(), tag = DB.inv.find(i=>i.n===u.nama && i.st==='tunggu'), wm = DB.match.find(m=>m.n===u.nama);
  return head('Beranda', `<div class="hero"><div class="hi">Assalamu'alaikum,</div><div class="big" style="font-size:24px">${esc(u.nama)}</div>${k?`<div class="sub">${PNAME[k.p]} · ${k.d} menit</div>

    `<main>${annBlock()}${wm?`<div class="sec">Mentor Anda</div><div class="card"><div class="row"><div class="ico">${svg('star')}</div><div class="grow"><div class="t">${wm.bids.length?`${wm.bids.length} kandidat mentor siap dipilih`:'Sedang mencarikan mentor'}</div><div class="m">${PNAME[wm.p]} ${wm.d} mnt · ${wm.bids.length?'pilih dalam 24 jam':'kami kabari lewat WA'}</div></div></div>${wm.bids.length?`<div style="margin-top:12px">${act('Lihat & pilih mentor','kandidat','shake',`data-id="${wm.id}"`)}</div>`:''}</div>`:''}${k?`<div class="sec">Sesi berikutnya</div>
    <div class="card"><div class="row"><div class="ico">${svg('cal')}</div><div class="grow"><div class="t">Sesi ${Math.min(k.used+1,k.tot)} · Kamis, 19.30 WIB</div><div class="m">${esc(k.m)} · Zoom</div></div></div>
    <div class="btns">${act('Ajukan izin','izin','ghost')}${act('Reschedule','reschedule','ghost')}</div></div>`:(wm?'':empty('Belum ada kelas aktif'))}
    ${tag?`<div class="sec">Tagihan</div><div class="card"><div class="t">${esc(tag.d)}</div><div class="m">${rp(tag.v)}</div><div style="margin-top:12px"><a class="btn shake" href="#bayar">Bayar sekarang</a></div></div>`:
      (k && k.tot-k.used<=1 ? `<div class="sec">Lanjutkan belajar</div><div class="card"><div class="t">Paket hampir habis</div><div class="m">Ambil 8 sesi untuk hemat 5%</div><div style="margin-top:12px">${act('Minta perpanjangan','mintaPerp','shake')}</div></div>`:'')}

P.lead = () => {
  const f = S.leadF, F = [['semua','Semua'],['baru','Baru'],['harga','Dapat harga'],['invoice','Invoice'],['lunas','Lunas']];
  const list = DB.leads.filter(l=>f==='semua'||l.st===f).slice().reverse();
  return head('Lead & Chat WA') + `<main><div class="chips">${F.map(([k,l])=>`<button class="${k===f?'on':''}" data-act="leadF" data-v="${k}">${l}</button>`).join('')}</div>
  ${list.map(l=>`<div class="card"><div class="row"><div class="ico">${svg('wa')}</div><div class="grow"><div class="t">${esc(l.n)}</div><div class="m">"${esc(l.q)}"</div></div>${CHIP[l.st]}</div>
    <div class="row" style="margin-top:10px;justify-content:space-between"><span class="chip">${esc(l.s)}</span><span class="m">${lalu(l.ts)} · dibalas bot</span></div>
    ${l.st==='baru'||l.st==='harga'?`<div class="btns">${act('Tandai dibalas','leadReply','lihat',`data-id="${l.id}"`)}${act('Buat invoice','leadInv','',`data-id="${l.id}"`)}</div>`:''}</div>`).join('') || empty('Tidak ada lead')}</main>`;

P.daftar = () => {
  const c = S.calc, off = c.p==='OFF'; if(off) c.d = 60;
  const h = hitung(c);
  const seg = (k, opts) => `<div class="seg">${opts.map(([v,l])=>`<button type="button" class="${c[k]===v?'on':''}" data-act="calc" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
  return head('Pendaftaran') + `<main><div class="card form">
  <label class="f" for="nama">Nama santri</label><input id="nama" type="text" data-bind="nama" placeholder="contoh: Bu Siti" value="${esc(c.nama)}">
  <label class="f">Paket</label>${seg('p',[['REG','Reguler'],['FLX','Fleksibel'],['OFF','Offline']])}
  <label class="f">Durasi</label>${seg('d', off?[[60,'60 menit']]:[[30,'30 menit'],[60,'60 menit']])}
  <label class="f">Jumlah sesi</label>${seg('s',[[4,'4 sesi'],[8,'8 sesi']])}
  <label class="check"><input type="checkbox" data-act="calcb" data-k="baru" ${c.baru?'checked':''}> Santri baru (biaya daftar)</label>
  ${off?`<label class="check"><input type="checkbox" data-act="calcb" data-k="anak" ${c.anak?'checked':''}> Anak di bawah 13 tahun</label><label class="check"><input type="checkbox" data-act="calcb" data-k="buku" ${c.buku?'checked':''}> Buku cetak Iqro/Tajwid</label>`:''}
  <div class="sum"><div class="row"><span>${PNAME[c.p]} ${c.d} mnt × ${c.s} sesi</span><b>${rp(h.base)}</b></div>
  ${h.disc?`<div class="row"><span>Diskon ${Math.round(h.disc*100)}%</span><b style="color:var(--ok)">−${rp(h.potong)}</b></div>`:''}
  ${h.reg?`<div class="row"><span>Biaya daftar</span><b>${rp(h.reg)}</b></div>`:''}${h.bk?`<div class="row"><span>Buku cetak</span><b>${rp(h.bk)}</b></div>`:''}
  <div class="row"><span class="tot">Total</span><span class="tot">${rp(h.tot)}</span></div><div class="m">Kuota izin ${IZIN[c.p]*c.s/4} · ${c.baru?'E-modul gratis terkirim saat lunas':'tanpa biaya daftar'}</div></div>
  <div style="margin-top:12px">${act('Kirim invoice ke WA','kirimInv')}</div></div></main>`;
};
const invCard = x => `<div class="card"><div class="row"><div class="ico">${svg('receipt')}</div><div class="grow"><div class="t">${esc(x.n)}</div><div class="m">${esc(x.d)}${x.jenis==='perpanjang'?' · perpanjangan':''}</div></div></div>
  <div class="row" style="justify-content:space-between;margin-top:10px"><span class="no">${esc(x.no||'')}${x.no?copyBtn(x.no):''}</span><span><b>${rp(x.v)}</b> ${CHIP[x.st]}</span></div>
  ${x.st==='tunggu' && can('invoice',me().role)?`<div class="btns">${act('Ingatkan','ingat','ghost',`data-id="${x.id}"`)}${act('Tandai lunas','lunas','ok',`data-id="${x.id}"`)}</div>`:''}</div>`;
P.invoice = () => {

P.matching = () => head('Matching Mentor') + `<main><div class="card form row" style="background:var(--tint)"><div class="ico" style="background:#fff">${svg('star')}</div><div class="grow"><div class="m" style="color:var(--ink)"><b>Reguler</b> langsung dapat mentor otomatis saat lunas. <b>Fleksibel &amp; Offline</b>: 4 pelamar pertama dikunci, santri memilih sendiri dalam 24 jam.</div></div></div>${DB.match.map(m=>`<div class="card"><div class="row"><div class="ico">${svg('star')}</div><div class="grow"><div class="t">${esc(m.n)}</div><div class="m">${PNAME[m.p]} ${m.d} mnt · ${m.s} sesi · ${esc(m.area)}</div></div>${CHIP[m.st]}</div>

P.kelas = () => head('Kelas Aktif') + `<main>${aktif().map(k=>{const pct=Math.round(k.used/k.tot*100), c=CFG();
  return `<div class="card"><div class="row"><div class="ico">${svg('book')}</div><div class="grow"><div class="t">${esc(k.n)}</div><div class="m">${esc(k.m)} · ${PNAME[k.p]} ${k.d}</div></div>${k.hari>c.sanksiHari?`<span class="chip bad">&gt; ${c.sanksiHari} hari</span>`:k.hari>c.bonusHari?`<span class="chip warn">&gt; ${c.bonusHari} hari</span>`:'<span class="chip ok">Normal</span>'}</div>

P.perpanjang = () => head('Perpanjangan') + `<main>${perluPerp().map(k=>{const v=hitung({p:k.p,d:k.d,s:k.tot,baru:false}).tot, pend=pendingPerp(k);

P.santri = () => {
  const q = S.santriQ.toLowerCase(), rows = [];
  DB.inv.filter(i=>i.st==='tunggu' && i.jenis==='baru').forEach(i=>rows.push({n:i.n, st:'<span class="chip warn">Menunggu bayar</span>', m:i.d}));
  DB.match.forEach(m=>rows.push({n:m.n, st:'<span class="chip">Menunggu mentor</span>', m:`${PNAME[m.p]} ${m.d} · ${m.area}`}));
  DB.kelas.forEach(k=>rows.push({n:k.n, st:k.st==='aktif'?'<span class="chip ok">Aktif</span>':'<span class="chip bad">Berhenti</span>', m:`${PNAME[k.p]} ${k.d} · ${k.m} · sesi ${k.used}/${k.tot}`}));
  const L = rows.filter(r=>!q || r.n.toLowerCase().includes(q) || r.m.toLowerCase().includes(q));
  return head('Data Santri') + `<main><div class="card form" style="padding:10px"><input id="santriQ" type="search" placeholder="Cari nama, paket, atau mentor…" value="${esc(S.santriQ)}" aria-label="Cari santri"></div>
  ${L.map(r=>card('user',esc(r.n),esc(r.m),r.st)).join('') || empty('Tidak ditemukan')}</main>`;
};

function openPop(html){
  document.documentElement.classList.add('no-scroll');
  document.getElementById('popwrap').innerHTML = `<div class="pop" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
}
function closePop(){ document.documentElement.classList.remove('no-scroll'); document.getElementById('popwrap').innerHTML=''; }
document.addEventListener('touchmove', e => { if(document.documentElement.classList.contains('no-scroll') && !e.target.closest('.sheet')) e.preventDefault(); }, {passive:false});
const wave = () => `<div class="wave">${Array.from({length:28},(_,i)=>`<i style="height:${6+((i*7)%13)}px"></i>`).join('')}</div>`;
let toastT;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.setAttribute('role','status');
    t.style.cssText='position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#10302F;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.display='block'; clearTimeout(toastT); toastT = setTimeout(()=>t.style.display='none', 2600);
}

const GROUP_ICON = {Utama:'home', Operasional:'brief', Mentor:'users', Keuangan:'wallet', Produk:'box', Pengaturan:'gear', Belajar:'book', Saya:'user', 'Super admin':'shield'};
function sideBar(cur){
  const groups = menuGroups(S.sideQ||'');
  let h = `<div class="brand"><div class="logo">QEC</div>${esc(CFG().usaha)}</div>
    <div class="search"><input id="sideQ" type="search" placeholder="Cari menu…" value="${esc(S.sideQ||'')}" aria-label="Cari menu"><kbd>/</kbd></div><div class="sgroups">`;
  for(const g in groups){
    const items = groups[g], hasCur = items.some(([id])=>id===cur), shut = !(S.openG.includes(g) || (hasCur && S.closedCur!==g) || S.sideQ), bsum = items.reduce((a,[,p])=>a+(p.badge?p.badge():0),0);
    if(items.length===1 && g==='Utama'){ const [id,p] = items[0]; h += `<a href="#${id}" class="solo ${id===cur?'on':''}">${svg(p.icon)}${p.label}</a>`; continue; }
    h += `<div class="sg ${shut?'':'open'}"><button class="sgh" data-act="fold" data-g="${esc(g)}" aria-expanded="${!shut}"><span class="gi">${svg(GROUP_ICON[g]||'grid')}</span><span class="gl">${g}</span>${shut&&bsum?`<span class="dot ping">${bsum}</span>`:''}<span class="chv">${svg('chev')}</span></button>`;
    if(!shut) h += `<div class="sgb">${items.map(([id,p])=>{ const b = p.badge ? p.badge() : 0;
      return `<a href="#${id}" class="${id===cur?'on':''}">${svg(p.icon)}<span class="lb">${p.label}</span>${b?`<span class="dot ping">${b}</span>`:lockI(p)}</a>`; }).join('')}</div>`;
    h += `</div>`;
  }
  if(!Object.keys(groups).length) h += `<div style="padding:10px;opacity:.75;font-size:13px">Menu tidak ditemukan</div>`;
  h += `</div><button class="sout" data-act="logout">${svg('out')}Keluar</button><div class="ver">Versi ${APP_VERSION}</div>`;
  return h;
}

/* ===================== TUR (panduan berjalan) ===================== */
let TOUR = null;
function fullTour(){
  const u = me(), desk = isDesk(), steps = [
    {page:'beranda', t:`Selamat datang, ${u.nama}`, d:`Tur singkat ini menunjukkan menu dan fitur untuk jabatan ${ROLES[u.role].label}. Bisa diulang kapan saja dari menu Panduan aplikasi atau tombol ?.`},
    {page:'beranda', sel:[desk?'#side':'.tabs'], t:desk?'Menu samping':'Menu bawah', d:desk?'Menu dikelompokkan per kategori. Tekan kategori untuk membuka/menutup. Angka merah = pekerjaan yang menunggu.':'5 tombol menu utama; tombol tengah di lengkungan. Menu lain ada di Lainnya, dan bisa diatur sendiri.'},
    ...(desk?[{page:'beranda', sel:['#sideQ'], t:'Cari menu', d:'Ketik nama menu atau tekan tombol / di keyboard.'}]:[]),
    {page:'beranda', sel:['[data-act=lonceng]'], t:'Lonceng notifikasi', d:'Kabar penting untuk Anda: invoice lunas, lowongan baru, santri memilih mentor, dan lain-lain.'},
    {page:'beranda', sel:['[data-act=help]'], t:'Tombol ?', d:'Penjelasan halaman yang sedang dibuka, tur per halaman, dan panduan lengkapnya.'}
  ];
  (CORE[u.role]||[]).forEach(id => { if(!can(id,u.role)) return; const g = guideOf(id); (g.tour||[]).slice(0, id==='beranda'?3:1).forEach((s,i) => steps.push({page:id, sel:s.sel, t: id==='beranda' ? s.t : `${PAGES[id].label}`, d: id==='beranda' ? s.d : `${g.r} ${s.d}`})); });
  steps.push({page:'panduan', sel:['[data-tour=guideList]'], t:'Panduan lengkap', d:'Semua menu dijelaskan rinci di sini: fitur, filter, arti setiap status, dan dari mana datanya. Selamat bekerja!'});
  return steps;

  const tip = L.querySelector('.tour-tip'), hole = L.querySelector('.tour-hole');
  tip.innerHTML = `<div class="tt-top"><span class="chip">${TOUR.i+1} / ${n}</span><button class="tt-x" data-act="tourSkip" aria-label="Tutup tur">✕</button></div><div class="t" style="font-size:16px;margin:8px 0 4px">${esc(st.t)}</div><div class="m" style="color:var(--ink);line-height:1.55">${esc(st.d)}</div>

    <div class="btns" style="margin-top:10px">${TOUR.i?act('Kembali','tourPrev','ghost sm'):act('Lewati','tourSkip','ghost sm')}${act(TOUR.i===n-1?'Selesai':'Lanjut','tourNext','ok sm')}</div>`;
  const put = () => {
    const vw = innerWidth, vh = innerHeight, tw = Math.min(360, vw*0.92);
    if(el){
      const r = el.getBoundingClientRect(), pad = 6, top = Math.max(4, r.top-pad), h = Math.min(r.height+pad*2, vh-8);
      Object.assign(hole.style, {left:(r.left-pad)+'px', top:top+'px', width:(r.width+pad*2)+'px', height:h+'px', opacity:1});
      const th = tip.offsetHeight || 220; let ty = top + h + 12; if(ty + th > vh - 8) ty = Math.max(8, top - th - 12); if(ty < 8) ty = Math.max(8, vh - th - 8);
      let tx = Math.min(Math.max(8, r.left + r.width/2 - tw/2), vw - tw - 8);
      Object.assign(tip.style, {left:tx+'px', top:ty+'px', width:tw+'px', transform:'none'});
    } else {
      Object.assign(hole.style, {left:(vw/2)+'px', top:(vh/2)+'px', width:'0px', height:'0px', opacity:1});
      Object.assign(tip.style, {left:'50%', top:'50%', width:tw+'px', transform:'translate(-50%,-50%)'});
    }
  };
  if(el){ const r = el.getBoundingClientRect(); if(r.top < 60 || r.bottom > innerHeight - 90) { el.scrollIntoView({block:'center'}); setTimeout(put, 260); } else put(); } else put();
}

    case 'pilihMentor': case 'tetapkan': {
      const m = M(); let n = el.dataset.n;
      if(a==='tetapkan'){ const f = pilihMentorOtomatis(); if(!f) return toast('Tidak ada mentor aktif'); n = f.x.n; }
      if(u.role==='santri' && m.n!==u.nama) return;
      DB.kelas.push({id:nid(), n:m.n, m:n, p:m.p, d:m.d, used:0, tot:m.s, iz:0, start:now(), hari:0, st:'aktif'});
      DB.match = DB.match.filter(x=>x.id!==m.id);
      notify([], `Anda dipilih sebagai mentor ${m.n}`, n);
      if(u.role!=='santri') notify([], `Mentor Anda: ${n}. Jadwal & grup kelas sudah dibuat.`, m.n); else notify(['owner','cs'], `${m.n} memilih ${n} sebagai mentor`);
      return done(u.role==='santri' ? `Anda memilih ${n} · jadwal & grup kelas dibuat` : `${n} ditetapkan untuk ${m.n} · jadwal & grup kelas dibuat (simulasi)`);
    }
    case 'toAbsen': S.absen.kid = id; S.absen.st='hadir'; go('absen'); return;
    case 'absenSt': S.absen.st = el.dataset.v; render(); return;
    case 'simpanAbsen': {
      const k = DB.kelas.find(x=>x.id===S.absen.kid), st = S.absen.st, mat = (document.getElementById('materi').value||'').trim();
      if(st==='izin'){ if(k.iz >= kuota(k)) return toast('Kuota izin habis — sesi dihitung hangus'); k.iz++; return done(`Izin ${k.n} dicatat · sesi digeser`); }
      k.used = Math.min(k.tot, k.used+1);
      DB.progres.push({kid:k.id, txt:`Sesi ${k.used} · ${st==='hangus'?'Hangus':'Hadir'} — ${mat || (st==='hangus'?'santri tidak hadir':'tanpa catatan')}`});
      notify([], `Laporan progres sesi ${k.used} sudah diisi mentor`, k.n);
      const sisa = k.tot - k.used;
      if(sisa<=1) notify(['owner','cs'], `${k.n}: sisa ${sisa} sesi, siapkan perpanjangan`);
      return done(sisa<=1 ? `Absen ${k.n} tersimpan · sisa ${sisa} sesi → alert perpanjangan` : `Absen ${k.n} tersimpan · progres terkirim ke santri`);
    }
    case 'riwayat': { const L = DB.progres.filter(p=>p.kid===id); openPop(`<h2>Riwayat progres</h2>${L.slice().reverse().map(p=>card('book',esc(p.txt.split(' — ')[0]),esc(p.txt.split(' — ')[1]||''))).join('') || empty('Belum ada catatan')}`); return; }
    case 'izin': { const k = myKelasSantri(); if(!k) return;
      openPop(`<h2>Ajukan izin</h2><div class="card"><div class="t">Sesi ${Math.min(k.used+1,k.tot)}</div><div class="m">Sisa kuota izin: ${kuota(k)-k.iz} · sesi digeser, tidak hangus</div></div>${act('Kirim izin','kirimIzin','ok')}`); return; }
    case 'kirimIzin': { const k = myKelasSantri(); if(k.iz >= kuota(k)) { closePop(); return toast('Ditolak otomatis: kuota izin habis. Kalau tidak hadir, sesi dihitung hangus.'); } k.iz++; notify([], `${k.n} izin untuk sesi berikutnya`, k.m); return done(`Izin disetujui otomatis · sisa ${kuota(k)-k.iz}`); }
    case 'reschedule': { const k = myKelasSantri(); notify([], `${k.n} minta reschedule sesi berikutnya`, k.m); return done('Permintaan reschedule dikirim ke mentor'); }
    case 'mintaPerp': notify(['owner','cs'], `${u.nama} minta perpanjangan paket`); return done('Permintaan perpanjangan dikirim ke admin');
    case 'kirimPerp': {
      const k = K(), h = hitung({p:k.p,d:k.d,s:k.tot,baru:false}), no = invNo();
      DB.inv.push({id:nid(), no, n:k.n, d:`${PNAME[k.p]} ${k.d} mnt · ${k.tot} sesi${h.disc?' − 5%':''}`, v:h.tot, st:'tunggu', jenis:'perpanjang', p:k.p, ts:now(), meta:{kid:k.id}});
      notify([], `Tagihan perpanjangan ${rp(h.tot)} siap dibayar`, k.n);
      return done(`Invoice perpanjangan ${no} ${rp(h.tot)} dikirim ke WA ${k.n} (simulasi)`);
    }
    case 'stop': { const k = K(); tutupKontrak(k, false); k.st='berhenti'; DB.komplain.push({id:nid(), n:k.n, t:'Link testimoni terkirim, menunggu isian', testi:true}); notify([], 'Terima kasih sudah belajar bersama kami. Mohon isi testimoni singkat.', k.n); return done(`${k.n} berhenti · pesan maaf + link testimoni terkirim`); }
    case 'bayarGaji': { const L = DB.pay.filter(p=>p.st==='belum'); L.forEach(p=>{ p.st='dibayar'; notify([], `Gaji ${rp(p.pk+p.b)} sudah ditransfer`, p.n); }); return done(`${L.length} gaji mentor dibayar · slip dikirim ke WA (simulasi)`); }
    case 'blokir': { const x = DB.mentors.find(y=>y.n===el.dataset.n); x.st='blokir'; x.calonBlokir=false; return done(`${x.n} diblokir · tidak menerima lowongan`); }
    case 'resolve': { DB.resolved.push(el.dataset.key); return done('Masalah ditandai sudah ditangani'); }
    case 'gotoMasalah': { const k = el.dataset.key; go(k.startsWith('sepi')?'matching':'kelas'); return; }
    case 'addKomplain': { const n = document.getElementById('kpn').value.trim(), t = document.getElementById('kpi').value.trim(), testi = document.getElementById('kpt').checked;
      if(!n||!t) return toast('Isi nama dan isinya dulu'); DB.komplain.push({id:nid(), n, t, testi, done:false}); if(!testi) notify(['owner'], `Komplain baru dari ${n}`); return done(`${testi?'Testimoni':'Komplain'} ${n} dicatat`); }
    case 'doneKomplain': { const x = DB.komplain.find(y=>y.id===id); x.done=true; return done(`Komplain ${x.n} selesai`); }
    case 'csv': {
      const rows = [['No','Tanggal','Santri','Rincian','Jenis','Jumlah','Status']].concat(DB.inv.map(i=>[i.no||'', new Date(i.ts||now()).toISOString().slice(0,10), i.n, i.d, i.jenis, Math.round(i.v), i.st]));
      const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const aEl = document.createElement('a'); aEl.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); aEl.download = 'rekap-qec.csv'; document.body.appendChild(aEl); aEl.click(); aEl.remove();
      log('Unduh rekap CSV'); save(); toast('Rekap diunduh'); return;
    }
    /* owner: pengaturan & data */
    case 'saveCfg': { document.querySelectorAll('[data-cfg]').forEach(inp=>{ const path = inp.dataset.cfg.split('.'), v = Math.max(0, Number(inp.value)||0); let o = DB.settings; for(let i=0;i<path.length-1;i++) o = o[path[i]]; o[path.at(-1)] = v; }); return done('Harga paket & gaji mentor diperbarui'); }
    case 'setTheme': DB.settings.theme = el.dataset.v; return done(`Tema diganti ke ${el.dataset.v==='teal'?'Teal QEC':'Hitam'}`);
    case 'savePeng': { const c = DB.settings; c.usaha = document.getElementById('cfgU').value.trim() || c.usaha; c.bonusHari = Math.max(1, Number(document.getElementById('cfgB').value)||40); c.sanksiHari = Math.max(c.bonusHari+1, Number(document.getElementById('cfgS').value)||60); const w = document.getElementById('cfgW'); if(!w.disabled) c.wa = w.checked; return done('Pengaturan disimpan'); }
    case 'addUser': openPop(`<h2>Tambah akun</h2><label class="f" for="uN">Nama</label><input id="uN" type="text" placeholder="contoh: Ustadzah Salma">
      <label class="f" for="uE">Email</label><input id="uE" type="email" placeholder="nama@qec.id"><label class="f" for="uP">Password awal</label><input id="uP" type="text" placeholder="minimal 6 karakter">
      <label class="f" for="uR">Jabatan</label>${roleSelect('mentor')}<div style="margin-top:14px">${act('Buat akun','saveUser','ok')}</div>`); return;
    case 'saveUser': { const n = document.getElementById('uN').value.trim(), em = document.getElementById('uE').value.trim().toLowerCase(), pw = document.getElementById('uP').value, r = document.getElementById('uR').value;
      if(!n || !/^\S+@\S+\.\S+$/.test(em) || pw.length<6) return toast('Isi nama, email yang benar, dan password minimal 6 karakter');
      if(DB.users.some(x=>x.email===em)) return toast('Email sudah dipakai');
      DB.users.push({email:em, pass:pw, role:r, nama:n, aktif:true});
      if(r==='mentor' && !DB.mentors.some(x=>x.n===n)) DB.mentors.push({n, a:'Mentor baru', s:4.5, st:'aktif'});
      return done(`Akun ${n} (${ROLES[r].label}) dibuat`); }
    case 'editUser': { const x = DB.users.find(y=>y.email===el.dataset.e);
      openPop(`<h2>${esc(x.nama)}</h2><div class="m" style="margin-bottom:6px">${esc(x.email)}</div><label class="f" for="uR">Jabatan</label>${roleSelect(x.role)}
      <label class="f" for="uP2">Reset password</label><input id="uP2" type="text" placeholder="kosongkan kalau tidak diganti">
      <div class="btns">${act(x.aktif?'Nonaktifkan':'Aktifkan','togUser',x.aktif?'bad':'ok',`data-e="${esc(x.email)}"`)}${act('Simpan','updUser','',`data-e="${esc(x.email)}"`)}</div>`); return; }
    case 'updUser': { const x = DB.users.find(y=>y.email===el.dataset.e), r = document.getElementById('uR').value, pw = document.getElementById('uP2').value;
      if(x.email===u.email && r!=='owner') return toast('Tidak bisa mengubah jabatan akun sendiri');
      x.role = r; if(pw){ if(pw.length<6) return toast('Password minimal 6 karakter'); x.pass = pw; } delete x.tabs;
      if(r==='mentor' && !DB.mentors.some(m=>m.n===x.nama)) DB.mentors.push({n:x.nama, a:'Mentor baru', s:4.5, st:'aktif'});
      return done(`Akun ${x.nama} diperbarui (${ROLES[r].label})`); }
    case 'togUser': { const x = DB.users.find(y=>y.email===el.dataset.e); if(x.email===u.email) return toast('Tidak bisa menonaktifkan akun sendiri'); x.aktif = !x.aktif; return done(`Akun ${x.nama} ${x.aktif?'diaktifkan':'dinonaktifkan'}`); }
    case 'addAnn': { const t = document.getElementById('annT').value.trim(); if(!t) return toast('Tulis pengumumannya dulu');
      DB.ann.push({id:nid(), t, penting:document.getElementById('annP').checked, on:true, login:document.getElementById('annL').checked, ts:now()});
      notify(['owner','keuangan','cs','mentor','santri'], `Pengumuman: ${t.slice(0,60)}`); return done('Pengumuman diterbitkan'); }
    case 'togAnn': { const x = DB.ann.find(y=>y.id===id); x.on = !x.on; return done(`Pengumuman ${x.on?'dinyalakan':'dimatikan'}`); }
    case 'delAnn': { DB.ann = DB.ann.filter(y=>y.id!==id); return done('Pengumuman dihapus'); }
    case 'bukaModul': { const m = DB.modules.find(x=>x.k===el.dataset.k);
      if(!DB.bills.some(b=>b.k===m.k && b.st==='belum')) DB.bills.push({id:nid(), no:`TAG-${String(DB.bills.length+1).padStart(2,'0')}-${m.k.toUpperCase()}`, d:`Modul ${m.n} · 1 bulan`, v:m.price, st:'belum', due:now()+3*DAY, ts:now(), k:m.k});
      log(`Membuka modul ${m.n} (tagihan dibuat)`); save(); closePop(); go('tagihan'); return; }
    case 'mintaModul': { const m = DB.modules.find(x=>x.k===el.dataset.k); notify(['owner'], `${u.nama} minta modul ${m.n} dibuka`); return done(`Permintaan modul ${m.n} dikirim ke owner`); }
    case 'renew': { const m = DB.modules.find(x=>x.k===el.dataset.k); m.noRenew = !m.noRenew; return done(m.noRenew?`${m.n}: tidak lanjut, tetap aktif sampai masa berlaku habis`:`${m.n}: dilanjutkan lagi`); }
    case 'payBill': { const b = DB.bills.find(x=>x.id===id);
      openPop(`<h2>Pembayaran</h2><div class="card"><div class="t">${esc(b.d)}</div><div class="m">${b.no}</div><div class="sum"><div class="row"><span class="tot">Total</span><span class="tot">${rp(b.v)}</span></div></div></div>
      <div class="m" style="margin-bottom:10px">Halaman pembayaran Mayar (simulasi). Pilih metode:</div>
      <div class="btns">${act('QRIS','paid','',`data-id="${b.id}"`)}${act('Transfer / VA','paid','ghost',`data-id="${b.id}"`)}</div>`); return; }
    case 'paid': { const b = DB.bills.find(x=>x.id===id); b.st='lunas'; b.paidAt=now(); if(b.k){ const m = DB.modules.find(x=>x.k===b.k); m.on = true; m.noRenew=false; notify(['owner'], `Modul ${m.n} aktif`); } return done(`${b.no} lunas${b.k?' · modul langsung aktif':''}`); }
    /* super admin */
    case 'saAs': session.as = el.dataset.e; store.set('qec_session2', session); log(`Masuk sebagai ${el.dataset.e}`); save(); location.hash = '#beranda'; render(); return;
    case 'saBack': delete session.as; store.set('qec_session2', session); location.hash = '#sa'; render(); return;
    case 'saMod': { const m = DB.modules.find(x=>x.k===el.dataset.k); m.on = el.dataset.v==='1'; return done(`Modul ${m.n} ${m.on?'diaktifkan':'dikunci'} oleh super admin`); }
    case 'saSaveMod': { document.querySelectorAll('[data-modp]').forEach(inp=>{ DB.modules.find(m=>m.k===inp.dataset.modp).price = Math.max(0, Number(inp.value)||0); }); return done('Harga modul disimpan'); }
    case 'saBill': { DB.bills.push({id:nid(), no:`TAG-${String(DB.bills.length+1).padStart(2,'0')}`, d:'Langganan aplikasi · bulan berjalan', v:99000, st:'belum', due:now()+7*DAY, ts:now()}); notify(['owner'], 'Tagihan aplikasi baru Rp99.000'); return done('Tagihan bulanan dibuat'); }
    case 'saClearLog': DB.log = []; return done('Log dikosongkan');
    /* pribadi */
    case 'izinNotif': { try{ Notification.requestPermission().then(()=>render()); }catch(_){ toast('Browser ini tidak mendukung notifikasi'); } return; }
    case 'tesNotif': headsUp('Ini notifikasi tes. Notifikasi berjalan baik.'); pushHp('Ini notifikasi tes.'); return;
    case 'saveAkun': { const usr = DB.users.find(x=>x.email===u.email), n = document.getElementById('akN').value.trim(), o = document.getElementById('akO').value, p = document.getElementById('akP').value;
      if(p){ if(o!==usr.pass) return toast('Password lama salah'); if(p.length<6) return toast('Password baru minimal 6 karakter'); usr.pass = p; }
      if(n && n!==usr.nama){ const old = usr.nama; usr.nama = n; if(usr.role==='mentor'){ DB.mentors.forEach(m=>{ if(m.n===old) m.n=n; }); DB.kelas.forEach(k=>{ if(k.m===old) k.m=n; }); DB.pay.forEach(x=>{ if(x.n===old) x.n=n; }); } if(usr.role==='santri'){ DB.kelas.forEach(k=>{ if(k.n===old) k.n=n; }); DB.inv.forEach(i=>{ if(i.n===old) i.n=n; }); } }
      return done(p?'Nama & password disimpan':'Akun disimpan'); }
  }
});
document.addEventListener('contextmenu', e => { if(!e.target.closest('input,textarea')) e.preventDefault(); });
render();
</script>
</body>
</html>
