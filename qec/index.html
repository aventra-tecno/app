<!doctype html>
<html lang="id" data-theme="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E8A88">
<title>QEC — Quran Edu Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== v0.1 prototipe — gaya Aventra ===== */
:root{
  --pri:#0E7C7A; --top1:#0E8A88; --top2:#20B7B5; --top3:#32BDBB; --pri-ink:#fff; --acc:#F1F804; --tint:#E2F6F5;
  --bg:#F1F8F8; --card:#fff; --ink:#10302F; --mut:#4F6766; --line:#DCEBEA;
  --ok:#14955B; --ok-bg:#DFF5EA; --bad:#D63A3A; --bad-bg:#FDE7E7;
  --warn:#B76E00; --warn-bg:#FFF1D6; --info:#1F6FD1; --info-bg:#E3EEFF;
  --rad:16px;
}
html[data-theme="hitam"]{ --pri:#1E2120; --top1:#1E2120; --top2:#2B302E; --top3:#333836; --acc:#F2B01E; --tint:#FFF4D6; --bg:#F4F4F1; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;font-size:15px}
h1,h2,.t,.big,.kpi b,.tot,.btn,.sec,.tabs a,.side,.logo,.tile,.avatar{font-family:'Poppins','Open Sans',system-ui,sans-serif}
html.no-scroll{overflow:hidden}
body{-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;cursor:pointer}
a{color:inherit}

/* header + hero satu warna, gradasi + lingkaran samar */
.top{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--top1),var(--top2) 65%,var(--top3));padding:18px 18px 22px}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.top::before{width:260px;height:260px;right:-80px;top:-110px}
.top::after{width:160px;height:160px;left:-60px;bottom:-90px}
html[data-theme="hitam"] .top::before{background:rgba(242,176,30,.10)}
.bar{position:relative;display:flex;align-items:center;gap:12px;z-index:1}
.logo{width:38px;height:38px;border-radius:12px;background:var(--acc);color:#10302F;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.04em}
html[data-theme="hitam"] .logo{background:var(--acc);color:#1E2120}
.bar h1{margin:0;font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{border:0;background:rgba(255,255,255,.16);color:#fff;height:38px;border-radius:999px;padding:0 12px 0 4px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.avatar i{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#10302F;display:grid;place-items:center;font-style:normal;font-weight:800}
html[data-theme="hitam"] .avatar i{background:var(--acc);color:#1E2120}
.hero{position:relative;z-index:1;margin-top:18px}
.hero .hi{font-size:13px;opacity:.8}
.hero .big{font-size:30px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.hero .sub{font-size:13.5px;font-weight:700;color:var(--acc);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:20px;font-weight:800}
.kpi span{font-size:12px;opacity:.85}

/* tanda gulir antara header & menu bawah */
main{padding:16px 16px 120px;position:relative}
main::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#B9D6D4;margin:-6px auto 12px}

.sec{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.t{font-weight:700;font-size:15px}
.m{font-size:13px;color:var(--mut);margin-top:2px}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--info-bg);color:var(--info);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--pri);flex:0 0 42px}
html[data-theme="hitam"] .ico{background:#FFF4D6;color:#1E2120}
.ico svg{width:22px;height:22px}

/* tombol harus terlihat tombol */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border-radius:12px;border:0;font-weight:700;font-size:14.5px;background:var(--pri);color:#fff;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.12)}
html[data-theme="hitam"] .btn{background:var(--acc);color:#1E2120}
.btn.ok{background:var(--ok);color:#fff} .btn.bad{background:var(--bad);color:#fff}
.btn.lihat{background:var(--info-bg);color:var(--info);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.btn.sm{min-height:40px;font-size:13.5px}
.shake{animation:shake 2.4s ease-in-out infinite}
@keyframes shake{0%,82%,100%{transform:translateX(0)}85%{transform:translateX(-4px)}88%{transform:translateX(4px)}91%{transform:translateX(-3px)}94%{transform:translateX(3px)}}

/* input rata kiri-kanan */
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
select,input[type=text],input[type=number]{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font:inherit;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:#E3EFEE;border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;min-height:40px;border-radius:9px;font-weight:700;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.check{display:flex;align-items:center;gap:10px;min-height:46px;font-weight:600;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--pri)}
.sum{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.sum .row{justify-content:space-between;font-size:14px;padding:3px 0}
.sum .tot{font-size:18px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--mut)}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
html[data-theme="hitam"] .chips button.on{background:var(--acc);border-color:var(--acc);color:#1E2120}
.prog{height:8px;border-radius:8px;background:#E3EFEE;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--pri);border-radius:8px}
html[data-theme="hitam"] .prog i{background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12.5px;font-weight:700;text-decoration:none;position:relative}
.dot{position:absolute;top:8px;right:10px;min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 6px}
.ping{animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(214,58,58,.55)}100%{box-shadow:0 0 0 10px rgba(214,58,58,0)}}

/* menu bawah: gradasi, ikon aktif terisi putih, menu ke-3 di lengkungan halus */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;height:84px;padding-bottom:env(safe-area-inset-bottom)}
.tabs svg.bg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 -4px 14px rgba(20,26,51,.18))}
.tabs .items{position:absolute;left:0;right:0;bottom:0;height:68px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.72);text-decoration:none;font-size:11px;font-weight:600;position:relative}
.tabs a svg{width:24px;height:24px}
.tabs a.on{color:#fff;font-weight:800}
.tabs a.on span{color:var(--acc)}
.tabs a.on svg{animation:pop 1.6s ease-in-out infinite}
.tabs a.on svg .fill{fill:#fff;fill-opacity:1}
.tabs a.on svg .fill ~ :not(.fill){stroke:var(--pri)}
.tabs a.mid{transform:translateY(-14px)}
.tabs a.mid svg{width:28px;height:28px}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
html[data-theme="hitam"] .tabs a.on{color:var(--acc)}
html[data-theme="hitam"] .tabs a.on svg .fill{fill:var(--acc)}
html[data-theme="hitam"] .tabs a.on svg .fill ~ :not(.fill){stroke:#1E2120}

/* pop up */
.pop{position:fixed;inset:0;z-index:50;background:rgba(15,20,40,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px 24px}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:#B9D6D4;margin:4px auto 12px}
.sheet h2{margin:0 0 10px;font-size:18px}
.play{border:0;width:40px;height:40px;border-radius:50%;background:var(--info-bg);color:var(--info);display:grid;place-items:center;flex:0 0 40px}
.wave{display:flex;align-items:center;gap:2px;height:20px;margin-top:6px}
.wave i{display:block;width:3px;border-radius:2px;background:#9FD3D1}

/* desktop: menu samping dari sumber yang sama */
.side{display:none}
@media (min-width:960px){
  body{display:flex}
  .side{display:flex;flex-direction:column;gap:4px;width:250px;flex:0 0 250px;min-height:100vh;background:linear-gradient(180deg,var(--top1),var(--top2));color:#fff;padding:20px 14px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px;font-weight:800}
  .side .g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:12px 10px 4px}
  .side a{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:600;color:rgba(255,255,255,.85)}
  .side a svg{width:20px;height:20px}
  .side a.on{background:#fff;color:var(--pri)}
  html[data-theme="hitam"] .side a.on{background:var(--acc);color:#1E2120}
  .side a .dot{position:static;margin-left:auto}
  #app{flex:1;min-width:0}
  .bar .logo{display:none}
  .tabs{display:none}
  main{max-width:1000px;margin:0 auto;padding:20px 28px 40px}
  main::before{display:none}
  .top{padding:22px 28px 26px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));max-width:900px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
  .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .pop{align-items:center}
  .sheet{border-radius:22px}
}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.demo{font-size:11px;color:var(--mut);text-align:center;margin-top:16px}

/* ===== v1.0 — login + data jalan ===== */
.login{min-height:100vh;display:flex;flex-direction:column}
.login .top{padding:34px 22px 70px;text-align:left}
.login .brandbig{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.login .brandbig .logo{width:48px;height:48px;font-size:14px}
.login .brandbig b{font-family:'Poppins',sans-serif;font-size:20px;display:block}
.login .brandbig span{font-size:13px;opacity:.9}
.login h1{font-family:'Poppins',sans-serif;margin:26px 0 0;font-size:30px;line-height:1.15;position:relative;z-index:1}
.login .hl{color:var(--acc);font-weight:700;font-size:14px;margin-top:6px;position:relative;z-index:1;font-family:'Poppins',sans-serif}
.login .box{margin:-44px 16px 0;position:relative;z-index:2}
.login .wrapin{max-width:460px;width:100%;margin:0 auto;padding-bottom:40px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-top:10px}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:5px;height:36px;border:0;background:var(--tint);color:var(--pri);border-radius:9px;padding:0 10px;font-weight:700;font-size:12.5px}
input[type=email],input[type=password]{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font:inherit;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--top2);outline-offset:1px}
.acc{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc code{font-size:12.5px;background:var(--tint);color:var(--pri);padding:2px 6px;border-radius:6px}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:20px;height:20px;flex:0 0 20px}
.acc .btn{flex:0 0 auto}
.acc .grow{flex:1;min-width:0}
@media (min-width:960px){ .login .top > *{max-width:460px;margin-left:auto;margin-right:auto} }
.mini{display:inline-flex;width:auto;padding:0 14px;min-height:40px;font-size:13.5px}
@media (min-width:960px){ .login{width:100%} .login .top{padding:40px 40px 80px} }
</style>
</head>
<body>
<nav class="side" id="side" aria-label="Menu samping"></nav>
<div id="app"></div>

<script>
/* ===================== ikon ===================== */
const I = {
  home:'<path class="fill" fill-opacity="0" d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  chat:'<path class="fill" fill-opacity="0" d="M4 5h16v11H9l-5 4z"/>',
  star:'<path class="fill" fill-opacity="0" d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
  book:'<path class="fill" fill-opacity="0" d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path class="fill" fill-opacity="0" d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/>',
  grid:'<rect class="fill" fill-opacity="0" x="3" y="3" width="7" height="7" rx="2"/><rect class="fill" fill-opacity="0" x="14" y="3" width="7" height="7" rx="2"/><rect class="fill" fill-opacity="0" x="3" y="14" width="7" height="7" rx="2"/><rect class="fill" fill-opacity="0" x="14" y="14" width="7" height="7" rx="2"/>',
  receipt:'<path class="fill" fill-opacity="0" d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  wallet:'<rect class="fill" fill-opacity="0" x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',
  chart:'<rect class="fill" fill-opacity="0" x="4" y="12" width="4" height="8" rx="1"/><rect class="fill" fill-opacity="0" x="10" y="7" width="4" height="13" rx="1"/><rect class="fill" fill-opacity="0" x="16" y="3" width="4" height="17" rx="1"/>',
  brief:'<rect class="fill" fill-opacity="0" x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
  check:'<circle class="fill" fill-opacity="0" cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  cal:'<rect class="fill" fill-opacity="0" x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  card:'<rect class="fill" fill-opacity="0" x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/>',
  user:'<circle class="fill" fill-opacity="0" cx="12" cy="8" r="4"/><path class="fill" fill-opacity="0" d="M4 21c0-4 4-6 8-6s8 2 8 6z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2.3.7 4 2.4 4 5.2"/>',
  plus:'<circle class="fill" fill-opacity="0" cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.9-3.5M4 4v4h4M4 13a8 8 0 0 0 14.9 3.5M20 20v-4h-4"/>',
  alert:'<path class="fill" fill-opacity="0" d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  box:'<path class="fill" fill-opacity="0" d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  tag:'<path class="fill" fill-opacity="0" d="M3 12V3h9l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/>',
  playi:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
  out:'<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h10"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  wa:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 1c-1-.5-2-1.5-2.5-2.5l1-1-1-2z"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]||''}</svg>`;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = v => 'Rp' + Math.round(v).toLocaleString('id-ID');

/* ===================== akun demo =====================
   Login ini hanya untuk demo di GitHub Pages: password tersimpan di kode.
   Versi produksi wajib pakai Supabase Auth. */
const ACCOUNTS = [
  {email:'owner@qec.id',    pass:'owner123',    role:'owner',    nama:'Ricky',                     ini:'R'},
  {email:'keuangan@qec.id', pass:'keuangan123', role:'keuangan', nama:'Staf Keuangan',             ini:'K'},
  {email:'cs@qec.id',       pass:'cs123',       role:'cs',       nama:'Staf CS',                   ini:'C'},
  {email:'mentor@qec.id',   pass:'mentor123',   role:'mentor',   nama:'Ustadzah Aisyah',           ini:'A'},
  {email:'santri@qec.id',   pass:'santri123',   role:'santri',   nama:'Bu Rina (contoh)',          ini:'R'}
];
const ROLES = {
  owner:{label:'Owner', tabs:['beranda','lead','matching','kelas','lainnya']},
  keuangan:{label:'Keuangan', tabs:['beranda','invoice','payroll','jurnal','lainnya']},
  cs:{label:'CS / Media', tabs:['beranda','lead','matching','daftar','lainnya']},
  mentor:{label:'Mentor', tabs:['beranda','lowongan','absen','kelasku','lainnya']},
  santri:{label:'Santri / Wali', tabs:['beranda','jadwal','bayar','progres','lainnya']}
};

/* ===================== menu (sumber tunggal) ===================== */
const PAGES = {
  beranda:{label:'Beranda',icon:'home',roles:'*',group:'Utama'},
  lead:{label:'Lead & Chat WA',short:'Lead',icon:'chat',roles:['owner','cs'],group:'Operasional'},
  daftar:{label:'Pendaftaran',short:'Daftar',icon:'plus',roles:['owner','cs'],group:'Operasional'},
  matching:{label:'Matching Mentor',short:'Matching',icon:'star',roles:['owner','cs'],group:'Operasional'},
  kelas:{label:'Kelas Aktif',short:'Kelas',icon:'book',roles:['owner','cs'],group:'Operasional'},
  perpanjang:{label:'Perpanjangan',short:'Perpanjang',icon:'refresh',roles:['owner','cs'],group:'Operasional'},
  masalah:{label:'Masalah',icon:'alert',roles:['owner'],group:'Operasional',badge:()=>masalahList().length},

const IZIN = {REG:1, FLX:3, OFF:3};
const POKOK = {REG:{30:80000,60:140000}, FLX:{30:80000,60:140000}, OFF:{60:220000}}; // per 4 sesi; offline: asumsi Rp55.000/sesi
const BONUS = {REG:20000, FLX:20000, OFF:0};                                        // offline: belum ditentukan
const DAFTAR = 30000, BUKU = 20000;
function hitung({p,d,s,baru,anak,buku}){
  const base = PRICE[p][d] * s/4;
  const disc = (s>=8 ? .05 : 0) + (p==='OFF' && anak ? .05 : 0);
  const reg = baru ? DAFTAR : 0, bk = (p==='OFF' && buku) ? BUKU : 0;
  return {base, disc, potong: base*disc, reg, bk, tot: base*(1-disc) + reg + bk};
}
const kuota = k => IZIN[k.p] * k.tot/4;

/* ===================== pop up & toast ===================== */
function openPop(html){
  document.documentElement.classList.add('no-scroll');
  document.getElementById('popwrap').innerHTML = `<div class="pop" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
}
function closePop(){ document.documentElement.classList.remove('no-scroll'); document.getElementById('popwrap').innerHTML=''; }
document.addEventListener('touchmove', e => { if(document.documentElement.classList.contains('no-scroll') && !e.target.closest('.sheet')) e.preventDefault(); }, {passive:false});
const wave = () => `<div class="wave">${Array.from({length:28},(_,i)=>`<i style="height:${6+((i*7)%13)}px"></i>`).join('')}</div>`;
let toastT;
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.setAttribute('role','status');
    t.style.cssText='position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#10302F;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.display='block'; clearTimeout(toastT); toastT = setTimeout(()=>t.style.display='none', 2600);
}

/* ===================== router ===================== */
function render(){
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name=theme-color]').content = theme==='teal' ? '#0E8A88' : '#1E2120';
  const app = document.getElementById('app'), side = document.getElementById('side');
  if(!me()){ side.style.display='none'; app.innerHTML = loginView(); return; }
  side.style.display='';
  let id = location.hash.replace('#','') || 'beranda';
  if(!P[id] || !can(id, me().role)) id = 'beranda';
  app.innerHTML = P[id]() + tabsBar(id);
  side.innerHTML = sideBar(id);
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });
const go = id => { if(location.hash === '#'+id) render(); else location.hash = '#'+id; };
const done = msg => { save(); closePop(); render(); if(msg) toast(msg); };

/* ===================== aksi ===================== */
document.addEventListener('submit', e => {
  if(e.target.id !== 'loginForm') return;
  e.preventDefault();
  const em = document.getElementById('em').value.trim().toLowerCase(), pw = document.getElementById('pw').value;
  S.email = em; S.pass = pw;
  const a = ACCOUNTS.find(x => x.email === em && x.pass === pw);
  if(!em || !pw){ S.err = 'Isi email dan password.'; return render(); }
  if(!a){ S.err = 'Email atau password salah.'; return render(); }
  S.err = ''; S.pass = ''; session = {email:a.email}; store.set('qec_session', session);
  location.hash = '#beranda'; render(); toast(`Assalamu'alaikum, ${a.nama}`);
});
document.addEventListener('input', e => {
  const b = e.target.dataset.bind; if(b) S.calc[b] = e.target.value;
  if(e.target.id==='em') S.email = e.target.value; if(e.target.id==='pw') S.pass = e.target.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.act==='calcb'){ S.calc[el.dataset.k] = el.checked; render(); }
  if(el.dataset.act==='pilihKelas'){ S.absen.kid = Number(el.value); render(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const a = el.dataset.act, id = Number(el.dataset.id), u = me();
  const M = () => DB.match.find(x=>x.id===id), K = () => DB.kelas.find(x=>x.id===id), V = () => DB.inv.find(x=>x.id===id);
  switch(a){
    case 'close': if(e.target===el) closePop(); return;
    case 'toast': closePop(); toast(el.dataset.msg); return;
    case 'showpw': S.showPw = !S.showPw; render(); return;
    case 'fill': { const x = ACCOUNTS.find(y=>y.email===el.dataset.e); S.email = x.email; S.pass = x.pass; S.err=''; render(); return; }
    case 'logout': { session = null; store.del('qec_session'); S.email=''; S.pass=''; S.err=''; closePop(); const t=document.getElementById('toast'); if(t) t.style.display='none'; history.replaceState(null,'',location.pathname); render(); window.scrollTo(0,0); return; }
    case 'akun': openPop(`<h2>${esc(u.nama)}</h2><div class="m" style="margin-bottom:14px">${esc(u.email)} · ${ROLES[u.role].label}</div>${act(`${svg('out')}Keluar`,'logout','bad')}`); return;
    case 'theme': theme = theme==='teal'?'hitam':'teal'; try{ localStorage.setItem('qec_theme',theme); }catch(_){} render(); return;
    case 'reset': DB = seed(); return done('Data contoh dikembalikan');
    case 'leadF': S.leadF = el.dataset.v; render(); return;
    case 'invF': S.invF = el.dataset.v; render(); return;
    case 'leadReply': { const l = DB.leads.find(x=>x.id===id); l.st='harga'; return done('Ditandai sudah dibalas'); }
    case 'leadInv': { const l = DB.leads.find(x=>x.id===id); S.calc.nama = l.n; S.calc.baru = true; go('daftar'); return; }
    case 'calc': { const k = el.dataset.k; S.calc[k] = k==='p' ? el.dataset.v : Number(el.dataset.v); render(); return; }
    case 'kirimInv': {
      const c = S.calc, nama = c.nama.trim(); if(!nama){ toast('Isi nama santri dulu'); document.getElementById('nama').focus(); return; }
      const h = hitung(c);
      const d = `${PNAME[c.p]} ${c.d} mnt · ${c.s} sesi${h.disc?` − ${Math.round(h.disc*100)}%`:''}${h.reg?' + daftar':''}${h.bk?' + buku':''}`;
      DB.inv.push({id:nid(), n:nama, d, v:h.tot, st:'tunggu', jenis:'baru', meta:{p:c.p,d:c.d,s:c.s,buku:!!h.bk}});
      const l = DB.leads.find(x=>x.n===nama); if(l) l.st='invoice'; else DB.leads.push({id:nid(), n:nama, s:'Input admin', q:`${PNAME[c.p]} ${c.d} mnt`, st:'invoice', t:'baru saja'});
      S.calc.nama = ''; return done(`Invoice ${rp(h.tot)} dikirim ke WA ${nama} (simulasi)`);
    }
    case 'lunas': case 'bayarSantri': {
      const v = V(); if(!v || v.st==='lunas') return; v.st = 'lunas';
      if(v.jenis==='baru' && v.meta){
        DB.match.push({id:nid(), n:v.n, p:v.meta.p, d:v.meta.d, s:v.meta.s, area:v.meta.p==='OFF'?'Surabaya (offline)':'Online', jadwal:'Sesuai permintaan', st:v.meta.p==='REG'?'auto':'cari', bids:[]});
        if(v.meta.buku) DB.stok.iqro = Math.max(0, DB.stok.iqro-1);
        const l = DB.leads.find(x=>x.n===v.n); if(l) l.st='lunas';
        return done(a==='bayarSantri' ? 'Pembayaran berhasil (simulasi). E-modul gratis terkirim.' : 'Lunas · jurnal tercatat · e-modul terkirim · lowongan di-broadcast');
      }
      if(v.jenis==='perpanjang'){
        const k = DB.kelas.find(x=>x.id===v.meta.kid);
        if(k){ tutupKontrak(k, true); Object.assign(k, {used:0, iz:0, hari:0}); }
        return done('Lunas · kontrak baru dimulai · gaji mentor tercatat');
      }
      return done('Ditandai lunas');
    }
    case 'broadcast': {
      const m = M(), cand = DB.mentors.filter(x=>x.st==='aktif' && !m.bids.includes(x.n) && x.n!=='Ustadzah Aisyah');
      if(m.bids.length>=4) return toast('Sudah 4 kandidat terkunci');
      if(!cand.length) return toast('Tidak ada mentor lain yang tersedia');
      m.bids.push(cand[0].n); if(m.bids.length>=4) m.st='pilih';
      return done(`${cand[0].n} menyatakan minat (simulasi)`);
    }
    case 'minat': {
      const m = M(); if(!m || m.bids.includes(u.nama) || m.bids.length>=4) return;
      m.bids.push(u.nama); if(m.bids.length>=4 && m.st!=='auto') m.st='pilih';
      return done('Minat terkirim. Profil & voice note Anda ikut dikirim ke santri.');
    }
    case 'kandidat': {
      const m = M();
      openPop(`<h2>${m.bids.length} kandidat terkunci</h2><div class="m" style="margin-bottom:10px">${esc(m.n)} · ${PNAME[m.p]} ${m.d}</div>${m.bids.map(n=>{const x=DB.mentors.find(y=>y.n===n)||{a:'',s:''};
        return `<div class="card"><div class="row"><button class="play" data-act="toast" data-msg="Memutar voice note tilawah ${esc(n)} (contoh)" aria-label="Putar voice note ${esc(n)}">${svg('playi')}</button><div class="grow"><div class="t">${esc(n)}</div><div class="m">${esc(x.a)} · ★ ${String(x.s).replace('.',',')}</div>${wave()}</div></div>
        <div style="margin-top:10px">${act('Pilih mentor ini','pilihMentor','mini',`data-id="${m.id}" data-n="${esc(n)}" style="width:100%"`)}</div></div>`;}).join('')}`);
      return;
    }
    case 'pilihMentor': case 'tetapkan': {
      const m = M(); let n = el.dataset.n;
      if(a==='tetapkan'){ const free = DB.mentors.filter(x=>x.st==='aktif').map(x=>({x, load:aktif().filter(k=>k.m===x.n).length})).sort((p,q)=>p.load-q.load || q.x.s-p.x.s); n = free[0].x.n; }
      DB.kelas.push({id:nid(), n:m.n, m:n, p:m.p, d:m.d, used:0, tot:m.s, iz:0, hari:0, st:'aktif'});
      DB.match = DB.match.filter(x=>x.id!==m.id);
      return done(`${n} ditetapkan · jadwal dibuat · grup kelas dibuat (simulasi)`);
    }
    case 'toAbsen': S.absen.kid = id; S.absen.st='hadir'; go('absen'); return;
    case 'absenSt': S.absen.st = el.dataset.v; render(); return;
    case 'simpanAbsen': {
      const k = DB.kelas.find(x=>x.id===S.absen.kid), st = S.absen.st, mat = (document.getElementById('materi').value||'').trim();
      if(st==='izin'){ if(k.iz >= kuota(k)) return toast('Kuota izin habis — sesi dihitung hangus'); k.iz++; k.hari += 3; return done('Izin dicatat · sesi digeser'); }
      k.used = Math.min(k.tot, k.used+1); k.hari += 3;
      DB.progres.push({kid:k.id, txt:`Sesi ${k.used} · ${st==='hangus'?'Hangus':'Hadir'} — ${mat || (st==='hangus'?'santri tidak hadir':'tanpa catatan')}`});
      const sisa = k.tot - k.used;
      return done(sisa<=1 ? `Tersimpan · sisa ${sisa} sesi → alert perpanjangan ke admin` : 'Tersimpan · laporan progres terkirim ke santri');
    }
    case 'riwayat': { const L = DB.progres.filter(p=>p.kid===id); openPop(`<h2>Riwayat progres</h2>${L.slice().reverse().map(p=>card('book',esc(p.txt.split(' — ')[0]),esc(p.txt.split(' — ')[1]||''))).join('') || empty('Belum ada catatan')}`); return; }
    case 'izin': {
      const k = myKelasSantri(); if(!k) return;
      openPop(`<h2>Ajukan izin</h2><div class="card"><div class="t">Sesi ${Math.min(k.used+1,k.tot)}</div><div class="m">Sisa kuota izin: ${kuota(k)-k.iz} · sesi digeser, tidak hangus</div></div>${act('Kirim izin','kirimIzin','ok')}`); return;
    }
    case 'kirimIzin': { const k = myKelasSantri(); if(k.iz >= kuota(k)) { closePop(); return toast('Ditolak otomatis: kuota izin habis'); } k.iz++; return done(`Izin disetujui otomatis · sisa ${kuota(k)-k.iz}`); }
    case 'mintaPerp': return toast('Permintaan perpanjangan dikirim ke admin');
    case 'kirimPerp': {
      const k = K(), h = hitung({p:k.p,d:k.d,s:k.tot,baru:false});
      DB.inv.push({id:nid(), n:k.n, d:`${PNAME[k.p]} ${k.d} mnt · ${k.tot} sesi${h.disc?' − 5%':''}`, v:h.tot, st:'tunggu', jenis:'perpanjang', meta:{kid:k.id}});
      return done(`Invoice perpanjangan ${rp(h.tot)} dikirim ke WA ${k.n} (simulasi)`);
    }
    case 'stop': { const k = K(); tutupKontrak(k, false); k.st='berhenti'; return done('Santri berhenti · pesan maaf + link testimoni terkirim'); }
    case 'bayarGaji': { DB.pay.forEach(p=>{ if(p.st==='belum') p.st='dibayar'; }); return done('Gaji dibayar · slip dikirim ke WA mentor (simulasi)'); }
    case 'blokir': { const x = DB.mentors.find(y=>y.n===el.dataset.n); x.st='blokir'; x.calonBlokir=false; return done(`${x.n} diblokir · tidak menerima lowongan`); }
    case 'mentorOk': { const x = DB.mentors.find(y=>y.n===el.dataset.n); x.calonBlokir=false; return done(`${x.n} tetap aktif`); }
    case 'csv': {
      const rows = [['Tanggal','Santri','Rincian','Jenis','Jumlah','Status']].concat(DB.inv.map(i=>[new Date().toISOString().slice(0,10), i.n, i.d, i.jenis, Math.round(i.v), i.st]));
      const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const aEl = document.createElement('a'); aEl.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); aEl.download = 'rekap-qec.csv'; document.body.appendChild(aEl); aEl.click(); aEl.remove();
      toast('Rekap diunduh'); return;
    }
  }
});
document.addEventListener('contextmenu', e => { if(!e.target.closest('input,textarea')) e.preventDefault(); });
render();
</script>
</body>
</html>
