<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BOY WIN BOY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: toko marketplace — header biru tua lengket + pencarian, beranda (banner, kategori, cari per motor, promo kilat, grid produk), halaman produk, keranjang, checkout, pesanan. Mobile: bottom nav. */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface-2: #eef1f7; --line: #dde2ec;
  --fg: #141a26; --muted: #5d6779; --ink: #0f1b3d; --ink-fg: #ffffff;
  --accent: #1f4fd8; --accent-soft: #e3eafc; --hot: #e8590c; --hot-soft: #fdebe0;
  --ok: #138a4b; --ok-soft: #dcf3e6; --warn: #a86a00; --warn-soft: #fbefd6;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px; --shadow: 0 1px 2px rgba(15, 27, 61, .06), 0 4px 14px rgba(15, 27, 61, .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d111a; --surface: #151b28; --surface-2: #1c2434; --line: #283246;
  --fg: #e8ecf4; --muted: #95a0b5; --ink: #0a1230; --ink-fg: #ffffff;
  --accent: #6f95ff; --accent-soft: #1c2a52; --hot: #ff8a45; --hot-soft: #3a2316;
  --ok: #4cc888; --ok-soft: #133426; --warn: #e5b248; --warn-soft: #3a2d12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d111a; --surface: #151b28; --surface-2: #1c2434; --line: #283246;
  --fg: #e8ecf4; --muted: #95a0b5; --ink: #0a1230; --ink-fg: #ffffff;
  --accent: #6f95ff; --accent-soft: #1c2a52; --hot: #ff8a45; --hot-soft: #3a2316;
  --ok: #4cc888; --ok-soft: #133426; --warn: #e5b248; --warn-soft: #3a2d12; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .02em; }
.muted { color: var(--muted); }
.xs { font-size: 12px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: 24px; text-transform: uppercase; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrapf { flex-wrap: wrap; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--ink); color: var(--ink-fg); }
.top .bar { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; }
.logo-mark { width: 38px; height: 38px; border-radius: 8px; background: var(--hot); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; color: #fff; transform: skewX(-8deg); }
.logo-txt { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: .04em; line-height: 1; white-space: nowrap; }
.logo-txt small { display: block; font-family: var(--body); font-weight: 500; font-size: 10px; letter-spacing: .14em; opacity: .7; text-transform: uppercase; margin-top: 3px; }
.search { display: flex; background: #fff; border-radius: 8px; overflow: hidden; min-width: 0; }
.search input { flex: 1; min-width: 0; border: 0; padding: 10px 12px; background: transparent; color: #141a26; outline: none; }
.search button { border: 0; background: var(--hot); color: #fff; padding: 0 16px; font-weight: 600; }
.top-ic { display: flex; gap: 4px; }
.ic-btn { position: relative; border: 0; background: transparent; color: inherit; padding: 8px; border-radius: 8px; display: grid; place-items: center; }
.ic-btn:hover { background: rgba(255,255,255,.1); }
.badge { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; border-radius: 9px; background: var(--hot); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.sub { font-size: 12px; opacity: .85; padding-bottom: 10px; display: flex; gap: 16px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.sub button { border: 0; background: none; color: inherit; padding: 0; opacity: .85; }
.sub button:hover { opacity: 1; text-decoration: underline; }
.demo-strip { background: var(--warn-soft); color: var(--warn); font-size: 12px; text-align: center; padding: 6px 16px; }

/* cards */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.sec { padding-block: 14px; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 12px; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }

/* hero */
.hero { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; padding-top: 16px; }
.slides { position: relative; border-radius: var(--r); overflow: hidden; min-height: 220px; background: var(--ink); color: #fff; }
.slide { position: absolute; inset: 0; padding: 28px; display: flex; flex-direction: column; justify-content: center; gap: 10px; opacity: 0; transition: opacity .5s; }
.slide.on { opacity: 1; }
.slide h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 800; text-transform: uppercase; max-width: 14ch; }
.slide p { margin: 0; max-width: 42ch; opacity: .85; }
.slide .cta { align-self: flex-start; border: 0; background: var(--hot); color: #fff; font-weight: 700; padding: 10px 18px; border-radius: 8px; }
.slide-art { position: absolute; right: -10px; bottom: -10px; width: 46%; max-width: 320px; opacity: .9; pointer-events: none; }
.dots { position: absolute; left: 28px; bottom: 14px; display: flex; gap: 6px; }
.dots button { width: 22px; height: 4px; border: 0; border-radius: 2px; background: rgba(255,255,255,.35); padding: 0; }
.dots button.on { background: #fff; }
.side-promos { display: grid; gap: 12px; }
.promo { border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; justify-content: center; gap: 4px; border: 0; text-align: left; }
.promo b { font-family: var(--display); font-size: 22px; text-transform: uppercase; }
.promo.a { background: var(--hot-soft); color: var(--hot); }
.promo.b { background: var(--accent-soft); color: var(--accent); }
.promo span { color: var(--fg); font-size: 13px; }

/* trust strip */
.trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; margin-top: 12px; }
.trust div { background: var(--surface); padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 13px; }
.trust svg { color: var(--accent); flex: none; }

/* categories */
.cats { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.cat { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; text-align: center; }
.cat:hover, .cat.on { border-color: var(--accent); color: var(--accent); }
.cat .ci { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--accent); }

/* motor finder */
.finder { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 10px; align-items: center; padding: 16px; }
.finder h3 { font-size: 20px; text-transform: uppercase; }
select, .inp { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0; }
.btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: #fff; white-space: nowrap; }
.btn.hot { background: var(--hot); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.plain { background: var(--surface-2); color: var(--fg); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* flash */
.flash { background: linear-gradient(90deg, var(--hot), #c2410c); color: #fff; border-radius: var(--r); padding: 14px; }
.flash .sec-head h2 { display: flex; align-items: center; gap: 10px; }
.clock { display: flex; gap: 4px; font-family: var(--mono); font-size: 14px; }
.clock span { background: rgba(0,0,0,.35); padding: 2px 6px; border-radius: 4px; }
.hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: 160px; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.flash .pc { color: var(--fg); }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--hot); }

/* product card */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.pc { background: var(--surface); border-radius: var(--r); overflow: hidden; border: 1px solid transparent; display: flex; flex-direction: column; text-align: left; padding: 0; position: relative; transition: border-color .15s, transform .15s; }
.pc:hover { border-color: var(--accent); transform: translateY(-2px); }
.pc .img { aspect-ratio: 1; max-width: 100%; background: var(--surface-2); display: grid; place-items: center; position: relative; }
.pc .img svg { width: 78%; height: 78%; }
.pc .tagd { position: absolute; top: 8px; left: 8px; background: var(--hot); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.pc .tagw { position: absolute; top: 8px; right: 8px; background: var(--ink); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: .06em; }
.pc .body { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.pc .nm { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 35px; }
.price { font-weight: 700; color: var(--hot); font-size: 16px; font-variant-numeric: tabular-nums; }
.strike { text-decoration: line-through; color: var(--muted); font-size: 12px; font-weight: 400; }
.pc .meta { margin-top: auto; display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }

/* listing */
.listing { display: grid; grid-template-columns: 230px 1fr; gap: 14px; padding-top: 16px; }
.filters { padding: 14px; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 110px); display: grid; gap: 14px; }
.filters h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.filters label { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; cursor: pointer; }
.price-in { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sortbar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; margin-bottom: 10px; flex-wrap: wrap; }
.sortbar button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.sortbar button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.filter-toggle { display: none; }

/* product detail */
.pd { display: grid; grid-template-columns: 420px 1fr; gap: 20px; padding: 20px; }
.pd-img { aspect-ratio: 1; max-width: 100%; background: var(--surface-2); border-radius: var(--r); display: grid; place-items: center; }
.pd-img svg { width: 80%; height: 80%; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.thumbs button { aspect-ratio: 1; border: 2px solid transparent; border-radius: 8px; background: var(--surface-2); padding: 8px; }
.thumbs button.on { border-color: var(--accent); }
.thumbs svg { width: 100%; height: 100%; }
.pd h1 { font-family: var(--body); font-size: 20px; font-weight: 600; line-height: 1.35; }
.price-box { background: var(--surface-2); padding: 14px; border-radius: var(--r); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.price-box .price { font-size: 28px; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.opt.on { border-color: var(--hot); color: var(--hot); background: var(--hot-soft); }
.swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); }
.qty { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.qty button { border: 0; background: var(--surface-2); width: 36px; font-size: 18px; }
.qty input { width: 52px; text-align: center; border: 0; background: var(--surface); padding: 8px 0; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 12px 16px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.seller { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 16px; }
.seller .av { width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; }
.stars { color: var(--warn); letter-spacing: 2px; }
.star-in button { border: 0; background: none; font-size: 26px; color: var(--line); padding: 0 2px; }
.star-in button.on { color: var(--warn); }

/* cart / checkout */
.two { display: grid; grid-template-columns: 1fr 340px; gap: 14px; padding-top: 16px; align-items: start; }
.ci-row { display: grid; grid-template-columns: auto 72px 1fr auto; gap: 12px; align-items: center; padding: 14px; border-bottom: 1px solid var(--line); }
.ci-row:last-child { border-bottom: 0; }
.ci-row .th { width: 72px; height: 72px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; }
.ci-row .th svg { width: 80%; height: 80%; }
.ci-row .nm { font-size: 13px; min-width: 0; }
.sum { padding: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 110px); display: grid; gap: 10px; }
.sum .ln { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.sum .tot { font-size: 18px; font-weight: 700; border-top: 1px dashed var(--line); padding-top: 10px; }
.radio-card { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; }
.radio-card:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fgrid .full { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; font-size: 13px; }
.field span { color: var(--muted); font-size: 12px; }
.err { color: var(--hot); font-size: 12px; }
.panel { padding: 16px; display: grid; gap: 12px; }
.panel h3 { font-size: 18px; text-transform: uppercase; }

/* orders */
.otabs { display: flex; gap: 0; overflow-x: auto; background: var(--surface); border-radius: var(--r) var(--r) 0 0; border-bottom: 1px solid var(--line); }
.otabs button { flex: 1; border: 0; background: none; padding: 12px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.otabs button.on { color: var(--hot); border-bottom-color: var(--hot); }
.order { padding: 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.track div { text-align: center; font-size: 11px; color: var(--muted); }
.track div::before { content: ""; display: block; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 6px; }
.track div.on { color: var(--ok); font-weight: 600; }
.track div.on::before { background: var(--ok); }

/* bottom nav (mobile) */
.bnav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bnav nav { display: grid; grid-template-columns: repeat(5, 1fr); }
.bnav button { border: 0; background: none; padding: 8px 0 6px; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); position: relative; }
.bnav button.on { color: var(--accent); }
.bnav .badge { right: calc(50% - 22px); top: 2px; }

/* drawer / modal / toast */
.scrim { position: fixed; inset: 0; background: rgba(5, 10, 25, .5); z-index: 70; display: grid; place-items: end center; }
.sheet { background: var(--surface); width: min(520px, 100%); max-height: 86vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
@media (min-width: 761px) { .scrim { place-items: center; } .sheet { border-radius: 14px; } }
.chat-log { display: grid; gap: 8px; max-height: 300px; overflow: auto; padding: 4px; }
.msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 13px; }
.msg.me { justify-self: end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.them { justify-self: start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 90; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.foot { margin-top: 30px; background: var(--surface); border-top: 1px solid var(--line); }
.foot .cols { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 20px; padding-block: 24px; font-size: 13px; }
.foot h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.foot button { display: block; border: 0; background: none; padding: 3px 0; color: var(--muted); text-align: left; }
.crumbs { font-size: 12px; color: var(--muted); padding-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--accent); }

@media (max-width: 960px) {
  .cats { grid-template-columns: repeat(4, 1fr); }
  .pd { grid-template-columns: 1fr; }
  .two { grid-template-columns: 1fr; }
  .sum { position: static; }
  .foot .cols { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .top .bar { grid-template-columns: auto 1fr; gap: 10px; }
  .top-ic { display: none; }
  .logo-txt { font-size: 19px; } .logo-txt small { display: none; }
  .logo-mark { width: 32px; height: 32px; font-size: 14px; }
  .hero { grid-template-columns: 1fr; }
  .side-promos { grid-template-columns: 1fr 1fr; }
  .slide { padding: 20px; } .slide-art { width: 52%; opacity: .35; }
  .trust { grid-template-columns: 1fr 1fr; }
  .finder { grid-template-columns: 1fr 1fr; } .finder h3 { grid-column: 1 / -1; } .finder .btn { grid-column: 1 / -1; }
  .listing { grid-template-columns: 1fr; }
  .filters { position: static; display: none; } .filters.open { display: grid; }
  .filter-toggle { display: inline-flex; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bnav { display: block; }
  .pd { padding: 14px; }
  .fgrid { grid-template-columns: 1fr; }
  .ci-row { grid-template-columns: auto 56px 1fr; } .ci-row .th { width: 56px; height: 56px; } .ci-row .act { grid-column: 2 / -1; display: flex; justify-content: space-between; align-items: center; }
  .seller { grid-template-columns: auto 1fr; } .seller .btns { grid-column: 1 / -1; }
  .sum.sticky-m { position: sticky; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); top: auto; z-index: 5; }
}

function results() {
  const norm = (x) => x.toLowerCase().replace(/-/g, '');
  const toks = norm(filt.q.trim()).split(/\s+/).filter(Boolean);

    if (filt.cat === 'promo' && !p.disc) return false;
    if (!['semua', 'promo'].includes(filt.cat) && p.cat !== filt.cat) return false;
    if (toks.length) { const hay = norm(`${p.name} ${p.sku} ${p.motors.join(' ')} ${p.color.name}`); if (!toks.every((t) => hay.includes(t))) return false; }
    if (filt.brands.length && !filt.brands.includes(p.brand)) return false;
    if (filt.motor && !p.motors.includes(filt.motor)) return false;
    if (filt.min && p.price < +filt.min) return false;
    if (filt.max && p.price > +filt.max) return false;

}

function addToCart(id, qty, only) {
  const p = byId(id);

  if (c) { c.qty = Math.min(p.stock, c.qty + qty); c.sel = true; } else cart.push({ id, qty: Math.min(p.stock, qty), sel: true });

function totals() {
  const sel = cart.filter((c) => c.sel && byId(c.id));
  const sub = sel.reduce((a, c) => a + byId(c.id).price * c.qty, 0);
  const base = sel.reduce((a, c) => a + byId(c.id).base * c.qty, 0);
  const w = sel.reduce((a, c) => a + byId(c.id).weight * c.qty, 0);
  const v = voucher && VOUCHERS[voucher];
  const vOk = v && sub >= v.min;
  return { sel, sub, save: base - sub, w, v, vOk, cut: vOk && v.cut ? v.cut(sub) : 0, shipCut: vOk && v.ship ? v.ship : 0, n: sel.reduce((a, c) => a + c.qty, 0) };
}

      ${t.shipCut ? `<div class="ln" style="color:var(--ok)"><span>Potongan ongkir</span><span>s.d. ${rp(t.shipCut)}</span></div>` : ''}

      <button class="btn hot" id="toCo" ${t.n ? '' : 'disabled'}>Checkout (${t.n})</button>
    </aside>
  </div>`;
  const setQty = (id, q) => { const c = cart.find((x) => x.id === id), p = byId(id); c.qty = Math.max(1, Math.min(p.stock, q || 1)); save(); pageCart(); };
  app.querySelectorAll('[data-dq]').forEach((b) => b.onclick = () => setQty(+b.dataset.dq, cart.find((x) => x.id === +b.dataset.dq).qty - 1));
  app.querySelectorAll('[data-iq]').forEach((b) => b.onclick = () => { const id = +b.dataset.iq, c = cart.find((x) => x.id === id); if (c.qty >= byId(id).stock) toast('Sudah maksimal stok'); setQty(id, c.qty + 1); });
  app.querySelectorAll('[data-q]').forEach((i) => i.onchange = () => setQty(+i.dataset.q, parseInt(i.value, 10)));
  app.querySelectorAll('[data-sel]').forEach((i) => i.onchange = () => { cart.find((x) => x.id === +i.dataset.sel).sel = i.checked; save(); pageCart(); });
  app.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { cart = cart.filter((x) => x.id !== +b.dataset.del); save(); pageCart(); });

  const useV = (code) => { code = code.trim().toUpperCase(); if (!code) { voucher = null; return pageCart(); } if (!VOUCHERS[code]) return toast('Kode voucher tidak dikenal'); voucher = code; pageCart(); };

  app.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => useV(b.dataset.v));
  app.querySelector('#toCo').onclick = () => go('checkout');
}

function qr(seed) { // pola QR palsu untuk demo
  let s = h(seed), cells = '';
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const f = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    const on = f ? (x % 6 === 0 || y % 6 === 0 || (x % 14 > 1 && x % 14 < 5 && y % 14 > 1 && y % 14 < 5) || (x > 13 && (x === 14 || x === 20)) || (y > 13 && (y === 14 || y === 20))) : ((s = (s * 1103515245 + 12345) >>> 0) >> 16) & 1;
    if (on) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 23 23" width="136" height="136" fill="#0f1b3d" aria-label="Contoh kode QR">${cells}</svg>`;
}

// chat penjual (demo)
function openChat(pid) {
  const p = pid ? byId(pid) : null;
  const log = [{ me: false, t: 'Halo, ada yang bisa dibantu? Kirim kode part atau tipe motor ya.' }];
  if (p) log.push({ me: true, t: `Kak, ${p.name} (${p.sku}) ready?` }, { me: false, t: p.stock ? `Ready kak, stok ${p.stock}. Bisa langsung checkout 🙏` : 'Lagi kosong kak, bisa inden dari WIN 2–3 hari.' });
  const sc = document.createElement('div'); sc.className = 'scrim';
  sc.innerHTML = `<div class="sheet" role="dialog" aria-label="Chat penjual"><div class="row between"><b>Chat BOY WIN BOY</b><button class="btn plain" id="cx">Tutup</button></div><div class="xs muted">Demo: balasan otomatis, belum terhubung ke admin.</div><div class="chat-log" id="cl"></div><form class="row" id="cf"><input class="inp" id="ct" placeholder="Tulis pesan…" autocomplete="off"><button class="btn">Kirim</button></form></div>`;
  document.body.appendChild(sc);
  const paint = () => { const cl = sc.querySelector('#cl'); cl.innerHTML = log.map((m) => `<div class="msg ${m.me ? 'me' : 'them'}">${esc(m.t)}</div>`).join(''); cl.scrollTop = cl.scrollHeight; };
  paint();
  sc.querySelector('#cx').onclick = () => sc.remove();
  sc.onclick = (e) => { if (e.target === sc) sc.remove(); };
  sc.querySelector('#cf').onsubmit = (e) => {
    e.preventDefault(); const v = sc.querySelector('#ct').value.trim(); if (!v) return;
    log.push({ me: true, t: v }); sc.querySelector('#ct').value = ''; paint();
    const hit = P.find((x) => v.toUpperCase().replace(/-/g, '').includes(x.sku.replace(/-/g, '').slice(0, 10)));
    setTimeout(() => { log.push({ me: false, t: hit ? `${hit.name}: ${hit.stock ? 'ready ' + hit.stock + ' pcs, ' + rp(hit.price) : 'kosong, bisa inden'}.` : 'Siap kak, admin cek dulu ya. Boleh kirim foto part lamanya.' }); paint(); }, 700);
  };
  sc.querySelector('#ct').focus();
}

// ---------- router ----------
function render() {
  clearInterval(slideTimer);
  const hsh = location.hash.slice(1) || 'beranda';
  document.querySelectorAll('[data-nav]').forEach((b) => b.classList.toggle('on', hsh === b.dataset.nav || (b.dataset.nav === 'pesanan' && hsh.startsWith('pesanan'))));
  if (hsh === 'beranda') pageHome();
  else if (hsh === 'cari') pageSearch();
  else if (hsh.startsWith('produk-')) pageProduct(hsh.slice(7));
  else if (hsh === 'keranjang') pageCart();
  else if (hsh === 'checkout') pageCheckout();
  else if (hsh === 'pesanan') pageOrders();
  else if (hsh.startsWith('pesanan-')) pageOrder(hsh.slice(8));
  else if (hsh === 'favorit') pageFav();
  else if (hsh === 'bantuan') pageHelp();
  else pageHome();
  if (!hsh.startsWith('produk-') && !hsh.startsWith('pesanan-')) window.scrollTo({ top: 0 });
}
